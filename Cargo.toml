[workspace]
members = [
    "crates/ac-core",
]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["autocomputer contributors"]
repository = "https://github.com/yygg693/autocomputer"

[workspace.dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
