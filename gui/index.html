<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autocomputer — AI Desktop Automation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════ Sidebar ═══════════ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="icon">🦀</div>
      <h1>autocomputer</h1>
    </div>
    <div class="sidebar-subtitle">AI Desktop Automation · v0.8</div>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-tab="dashboard">
      <span class="nav-icon">📊</span><span>Dashboard</span>
    </button>
    <button class="nav-item" data-tab="editor">
      <span class="nav-icon">✏️</span><span>录制编辑器</span>
      <span class="nav-badge">New</span>
    </button>
    <button class="nav-item" data-tab="flows">
      <span class="nav-icon">📋</span><span>流程管理</span>
      <span class="nav-badge" id="flowCount">0</span>
    </button>
    <button class="nav-item" data-tab="monitor">
      <span class="nav-icon">👁️</span><span>实时监控</span>
    </button>
    <button class="nav-item" data-tab="security">
      <span class="nav-icon">🛡️</span><span>安全审计</span>
    </button>
  </nav>
  <div class="sidebar-footer">
    <div style="display:flex;align-items:center;font-size:12px;color:var(--text-muted);">
      <span class="status-dot online"></span>Core Engine Active
    </div>
  </div>
</aside>

<!-- ═══════════ Main Content ═══════════ -->
<main class="main">
  <div class="topbar">
    <h2 id="pageTitle">📊 Dashboard</h2>
    <button class="btn btn-ghost btn-sm" onclick="refreshAll()">⟳ Refresh</button>
  </div>
  <div class="content" id="content"></div>
</main>

<!-- ═══════════ Toast Container ═══════════ -->
<div class="toast-container" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
