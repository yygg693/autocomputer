<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>autocomputer — AI Desktop Automation</title>
<style>
/* ══════════════════════════════════════════
   autocomputer v0.7 — Design System
   ══════════════════════════════════════════ */
:root {
  --bg-base: #090b10;
  --bg-surface: #11141f;
  --bg-card: #161925;
  --bg-hover: #1c2030;
  --border: #252840;
  --border-light: #2e3250;
  --text-primary: #e8ecf4;
  --text-secondary: #888ea8;
  --text-muted: #555b70;

  --accent: #5b7fff;
  --accent-light: #8ba4ff;
  --accent-glow: rgba(91,127,255,0.15);
  --accent-gradient: linear-gradient(135deg, #5b7fff, #8b5cf6);

  --green: #22c55e;
  --green-glow: rgba(34,197,94,0.12);
  --red: #ef4444;
  --red-glow: rgba(239,68,68,0.12);
  --orange: #f59e0b;
  --orange-glow: rgba(245,158,11,0.12);
  --purple: #a855f7;
  --cyan: #06b6d4;

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font); background: var(--bg-base); color: var(--text-primary);
  height: 100vh; display: flex; overflow: hidden; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: white; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ═══════════ Sidebar ═══════════ */
.sidebar {
  width: 260px; background: var(--bg-surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;
}
.sidebar-header {
  padding: 24px 20px 20px; border-bottom: 1px solid var(--border);
}
.sidebar-logo {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
}
.sidebar-logo .icon {
  width: 36px; height: 36px; border-radius: var(--radius);
  background: var(--accent-gradient); display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: white;
}
.sidebar-logo h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.sidebar-subtitle { font-size: 11px; color: var(--text-muted); padding-left: 46px; }
.sidebar-nav { padding: 12px 8px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); border: none; background: none; width: 100%; text-align: left;
  transition: all var(--transition); position: relative;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active {
  background: var(--accent-glow); color: var(--accent-light);
  box-shadow: inset 0 0 0 1px rgba(91,127,255,0.2);
}
.nav-item .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-item .nav-badge {
  margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 10px;
  background: var(--accent); color: white; font-weight: 600;
}
.sidebar-footer {
  padding: 16px 20px; border-top: 1px solid var(--border);
}
.status-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
  position: relative;
}
.status-dot.online {
  background: var(--green);
  box-shadow: 0 0 8px var(--green-glow), 0 0 2px var(--green);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%,100% { box-shadow: 0 0 8px var(--green-glow), 0 0 2px var(--green); }
  50% { box-shadow: 0 0 16px var(--green-glow), 0 0 6px var(--green); }
}

/* ═══════════ Main ═══════════ */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  background: var(--bg-base);
}
.topbar h2 { font-size: 16px; font-weight: 600; flex: 1; letter-spacing: -0.2px; }
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* ═══════════ Cards ═══════════ */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 16px;
  transition: border-color var(--transition);
}
.card:hover { border-color: var(--border-light); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-header h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.card-header .card-badge {
  font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 500;
}
.card-header .card-badge.info { background: var(--accent-glow); color: var(--accent-light); }
.card-header .card-badge.success { background: var(--green-glow); color: var(--green); }
.card-header .card-badge.warning { background: var(--orange-glow); color: var(--orange); }

/* ═══════════ Stats Grid ═══════════ */
.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px;
}
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; text-align: center;
  transition: all var(--transition); cursor: default; position: relative; overflow: hidden;
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  opacity: 0; transition: opacity var(--transition);
}
.stat-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.stat-card:hover::before { opacity: 1; }
.stat-card.accent::before { background: var(--accent); }
.stat-card.green::before { background: var(--green); }
.stat-card.purple::before { background: var(--purple); }
.stat-card.cyan::before { background: var(--cyan); }
.stat-value { font-size: 30px; font-weight: 800; line-height: 1.2; letter-spacing: -1px; }
.stat-value.accent { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat-value.green { color: var(--green); }
.stat-value.purple { color: var(--purple); }
.stat-value.cyan { color: var(--cyan); }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

/* ═══════════ Buttons ═══════════ */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
  border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer;
  border: 1px solid transparent; transition: all var(--transition); white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-light); box-shadow: 0 4px 12px var(--accent-glow); }
.btn-outline { background: transparent; border-color: var(--border); color: var(--text-secondary); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent-light); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-success { background: var(--green); color: #000; }
.btn-success:hover { background: #16a34a; }
.btn-warning { background: var(--orange); color: #000; }
.btn-danger { background: transparent; color: var(--red); border-color: rgba(239,68,68,0.3); }
.btn-danger:hover { background: var(--red); color: white; }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-xs { padding: 3px 7px; font-size: 10px; border-radius: 6px; }

/* ═══════════ Table ═══════════ */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border);
  color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
}
td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
tr:hover td { background: var(--bg-hover); }
td:first-child { color: var(--text-primary); font-weight: 500; }

/* ═══════════ Editor ═══════════ */
.editor-layout { display: flex; gap: 16px; height: calc(100vh - 220px); }
.editor-toolbar { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.step-sidebar {
  width: 360px; flex-shrink: 0; background: var(--bg-surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; overflow: hidden;
}
.step-sidebar-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between;
}
.step-list { flex: 1; overflow-y: auto; padding: 8px; }
.step-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 6px; cursor: grab; font-size: 13px; transition: all var(--transition);
}
.step-item:hover { border-color: var(--border-light); box-shadow: var(--shadow); }
.step-item:active { cursor: grabbing; }
.step-icon {
  width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.step-icon.click { background: rgba(91,127,255,0.15); color: var(--accent-light); }
.step-icon.type { background: rgba(34,197,94,0.15); color: var(--green); }
.step-icon.press { background: rgba(245,158,11,0.15); color: var(--orange); }
.step-icon.wait { background: rgba(168,85,247,0.15); color: var(--purple); }
.step-icon.scroll { background: rgba(6,182,212,0.15); color: var(--cyan); }
.step-icon.move { background: rgba(239,68,68,0.15); color: var(--red); }
.step-info { flex: 1; min-width: 0; }
.step-info .step-title { color: var(--text-primary); font-weight: 500; }
.step-info .step-detail { color: var(--text-muted); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-remove { color: var(--text-muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
.step-remove:hover { color: var(--red); background: var(--red-glow); }

.step-preview {
  flex: 1; background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-muted); gap: 12px;
}
.preview-icon { font-size: 48px; opacity: 0.3; }

/* ═══════════ Monaco-style Log ═══════════ */
.log-container {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
}
.log-header {
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; font-size: 12px;
}
.log-tabs { display: flex; gap: 4px; }
.log-tab {
  padding: 4px 12px; border-radius: 6px; font-size: 11px; cursor: pointer;
  background: transparent; color: var(--text-muted); border: none;
}
.log-tab.active { background: var(--bg-hover); color: var(--text-primary); }
.log-body { padding: 12px 16px; max-height: 400px; overflow-y: auto; font-family: var(--mono); font-size: 12px; line-height: 1.8; }
.log-line { display: flex; gap: 12px; }
.log-line .time { color: var(--text-muted); flex-shrink: 0; width: 70px; }
.log-line .level { flex-shrink: 0; width: 50px; font-weight: 600; }
.log-line .level.info { color: var(--accent-light); }
.log-line .level.ok { color: var(--green); }
.log-line .level.warn { color: var(--orange); }
.log-line .level.err { color: var(--red); }
.log-line .msg { color: var(--text-secondary); flex: 1; }

/* ═══════════ Toast ═══════════ */
.toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast {
  padding: 12px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
  animation: slideIn 0.3s ease; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 8px; max-width: 360px;
}
.toast.success { background: #064e3b; border: 1px solid var(--green); color: var(--green); }
.toast.error { background: #450a0a; border: 1px solid var(--red); color: var(--red); }
.toast.info { background: var(--bg-card); border: 1px solid var(--accent); color: var(--accent-light); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ═══════════ Empty State ═══════════ */
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 13px; margin-bottom: 12px; }

/* ═══════════ Permission Grid ═══════════ */
.perm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 10px; }
.perm-card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; font-size: 13px;
}
.perm-card .app-name { font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
.perm-tag {
  display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px; margin: 2px; font-weight: 500;
}
.perm-tag.allow { background: var(--green-glow); color: var(--green); }
.perm-tag.deny { background: var(--red-glow); color: var(--red); }
.perm-tag.prompt { background: var(--orange-glow); color: var(--orange); }

/* ═══════════ Responsive ═══════════ */
@media (max-width: 768px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .editor-layout { flex-direction: column; height: auto; }
  .step-sidebar { width: 100%; max-height: 300px; }
  .sidebar { width: 200px; }
}

/* ═══════════ Page Transitions ═══════════ */
.page-enter { animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ═══════════ Sidebar ═══════════ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="icon">🦀</div>
      <h1>autocomputer</h1>
    </div>
    <div class="sidebar-subtitle">AI Desktop Automation · v0.7</div>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-tab="dashboard">
      <span class="nav-icon">📊</span><span>Dashboard</span>
    </button>
    <button class="nav-item" data-tab="editor">
      <span class="nav-icon">✏️</span><span>录制编辑器</span>
      <span class="nav-badge">New</span>
    </button>
    <button class="nav-item" data-tab="flows">
      <span class="nav-icon">📋</span><span>流程管理</span>
      <span class="nav-badge" id="flowCount">0</span>
    </button>
    <button class="nav-item" data-tab="monitor">
      <span class="nav-icon">👁️</span><span>实时监控</span>
    </button>
    <button class="nav-item" data-tab="security">
      <span class="nav-icon">🛡️</span><span>安全审计</span>
    </button>
  </nav>
  <div class="sidebar-footer">
    <div style="display:flex;align-items:center;font-size:12px;color:var(--text-muted);">
      <span class="status-dot online"></span>Core Engine Active
    </div>
  </div>
</aside>

<!-- ═══════════ Main Content ═══════════ -->
<main class="main">
  <div class="topbar">
    <h2 id="pageTitle">📊 Dashboard</h2>
    <button class="btn btn-ghost btn-sm" onclick="refreshAll()">⟳ Refresh</button>
  </div>
  <div class="content" id="content"></div>
</main>

<!-- ═══════════ Toast Container ═══════════ -->
<div class="toast-container" id="toasts"></div>

<script>
/* ══════════════════════════════════════════
   autocomputer GUI — Application Logic
   ══════════════════════════════════════════ */

// ── State ──
const state = {
  tab: 'dashboard',
  flows: JSON.parse(localStorage.getItem('ac_flows') || '[]'),
  editing: [],
};

// ── Navigation ──
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    document.getElementById('pageTitle').textContent = btn.querySelector('span:not(.nav-icon):not(.nav-badge)').textContent.trim();
    render();
  });
});

// ── Rendering ──
function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  content.appendChild(({
    dashboard: renderDashboard, editor: renderEditor,
    flows: renderFlows, monitor: renderMonitor, security: renderSecurity,
  }[state.tab] || renderDashboard)());
  updateBadges();
}

function updateBadges() {
  document.getElementById('flowCount').textContent = state.flows.length;
}

// ── Toast ──
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  el.innerHTML = `<span>${icons[type]}</span> ${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

// ── API Base ──
const API = 'http://127.0.0.1:8765';

async function api(path, opts = {}) {
  try {
    const resp = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    return await resp.json();
  } catch (e) {
    return { error: 'API offline — start: python -m autocomputer serve' };
  }
}

// ── Refresh ──
function refreshAll() { render(); toast('Refreshed', 'info'); }

function switchTab(name) {
  state.tab = name;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.getElementById('pageTitle').textContent = {
    dashboard:'📊 Dashboard', editor:'✏️ 录制编辑器', flows:'📋 流程管理',
    monitor:'👁️ 实时监控', security:'🛡️ 安全审计'
  }[name];
  render();
}

/* ═══════════ DASHBOARD ═══════════ */
async function renderDashboard() {
  const div = document.createElement('div'); div.className = 'page-enter';
  const status = await api('/api/status');
  const monitors = await api('/api/monitors');
  const online = !status.error && status.rust_core;
  const screen = status.screen || 'Unknown';

  div.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card accent">
        <div class="stat-value accent">${state.flows.length}</div>
        <div class="stat-label">录制流程</div>
      </div>
      <div class="stat-card green">
        <div class="stat-value green">${online ? '5' : '0'}</div>
        <div class="stat-label">Rust 核心模块</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-value purple">27</div>
        <div class="stat-label">测试通过</div>
      </div>
      <div class="stat-card cyan">
        <div class="stat-value cyan">${screen}</div>
        <div class="stat-label">屏幕分辨率</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>系统概览</h3>
        <span class="card-badge ${online ? 'success' : 'warning'}">${online ? 'Online' : 'Offline'}</span>
      </div>
      <table>
        <tr><td>架构</td><td>Rust (ac-core) + Python SDK + HTML5 GUI</td></tr>
        <tr><td>引擎状态</td><td>${online ? '✅ Connected — Rust core active' : '⚠️ Offline — start server first'}</td></tr>
        <tr><td>Rust 模块</td><td>capture · input · window · security · image_proc</td></tr>
        <tr><td>截图性能</td><td>~8ms (DXGI · xcap)</td></tr>
        <tr><td>显示器</td><td>${monitors.count || 0} monitor(s) @ ${screen}</td></tr>
      </table>
    </div>

    <div class="card">
      <div class="card-header"><h3>快速操作</h3></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="quickCapture()">📸 截取屏幕</button>
        <button class="btn btn-success" onclick="switchTab('editor')">✏️ 新建录制</button>
        <button class="btn btn-outline" onclick="switchTab('flows')">▶️ 回放流程</button>
        <button class="btn btn-ghost" onclick="window.open('https://github.com/autocomputer-rs/autocomputer')">📖 GitHub →</button>
      </div>
    </div>
  `;
  return div;
}

async function quickCapture() {
  const data = await api('/api/capture');
  if (data.error) { toast(data.error, 'error'); return; }
  toast(`Screenshot: ${data.width}×${data.height}, ${(data.png_size/1024).toFixed(0)}KB`, 'success');
}

/* ═══════════ EDITOR ═══════════ */
const ACTION_DEFS = {
  click: { emoji:'🖱️', cls:'click', defaults:{x:0,y:0,button:'left'}, desc:'鼠标点击' },
  type: { emoji:'⌨️', cls:'type', defaults:{text:'hello',method:'auto'}, desc:'输入文字' },
  press: { emoji:'🔑', cls:'press', defaults:{key:'enter'}, desc:'按键操作' },
  wait: { emoji:'⏳', cls:'wait', defaults:{ms:1000}, desc:'等待延迟' },
  scroll: { emoji:'📜', cls:'scroll', defaults:{clicks:1}, desc:'滚轮滚动' },
  move: { emoji:'➡️', cls:'move', defaults:{x:0,y:0}, desc:'移动鼠标' },
};

function renderEditor() {
  const div = document.createElement('div'); div.className = 'page-enter';

  div.innerHTML = `
    <div class="editor-toolbar">
      ${Object.entries(ACTION_DEFS).map(([action, def]) =>
        `<button class="btn btn-outline btn-sm" onclick="addStep('${action}')">${def.emoji} ${def.desc}</button>`
      ).join('')}
      <div style="flex:1"></div>
      <button class="btn btn-success btn-sm" onclick="saveFlow()">💾 Save Flow</button>
      <button class="btn btn-warning btn-sm" onclick="testFlow()">▶️ Test Run</button>
      <button class="btn btn-primary btn-sm" onclick="exportFlowJSON()">📋 Export JSON</button>
      <button class="btn btn-ghost btn-sm" onclick="clearEditor()">🗑 Clear</button>
    </div>
    <div class="editor-layout">
      <div class="step-sidebar">
        <div class="step-sidebar-header">
          Steps <span style="color:var(--text-muted);font-size:12px;">${state.editing.length} total</span>
        </div>
        <div class="step-list" id="stepList">
          ${state.editing.length === 0
            ? '<div class="empty-state"><div class="empty-icon">🎬</div><p>No steps yet</p><p style="font-size:11px;">Click action buttons above to build a flow</p></div>'
            : ''}
        </div>
      </div>
      <div class="step-preview">
        ${state.editing.length === 0
          ? '<div class="preview-icon">✏️</div><p style="font-size:13px;">添加步骤来构建自动化流程</p><p style="font-size:11px;">拖拽步骤可调整顺序</p>'
          : `<div class="preview-icon">🤖</div><p style="font-size:14px;color:var(--text-primary);">${state.editing.length} 个步骤就绪</p><p style="font-size:12px;">点击 ▶️ Test Run 执行</p>`
        }
      </div>
    </div>
  `;

  setTimeout(() => {
    const list = document.getElementById('stepList');
    if (list && state.editing.length > 0) {
      list.innerHTML = state.editing.map((s, i) => `
        <div class="step-item" draggable="true">
          <span class="step-icon ${s.cls}">${s.emoji}</span>
          <div class="step-info">
            <div class="step-title">#${i+1} ${s.action.toUpperCase()}</div>
            <div class="step-detail">${JSON.stringify(s.params)}</div>
          </div>
          <span class="step-remove" onclick="removeStep(${i})">×</span>
        </div>
      `).join('');
    }
  }, 0);

  return div;
}

function addStep(action) {
  const def = ACTION_DEFS[action];
  state.editing.push({ action, params: {...def.defaults}, emoji: def.emoji, cls: def.cls });
  render();
  toast(`Added: ${def.desc}`, 'success');
}

function removeStep(i) { state.editing.splice(i, 1); render(); }

function clearEditor() { state.editing = []; render(); toast('Editor cleared', 'info'); }

function saveFlow() {
  const name = prompt('流程名称:', `flow_${Date.now()}`);
  if (!name) return;
  state.flows.push({ name, steps: state.editing.map(s => ({action:s.action, params:s.params})), created: new Date().toISOString() });
  localStorage.setItem('ac_flows', JSON.stringify(state.flows));
  state.editing = [];
  toast(`Saved: ${name} (${state.flows.length} total)`, 'success');
  switchTab('flows');
}

async function testFlow() {
  if (!state.editing.length) return toast('No steps to test', 'error');
  toast(`Executing ${state.editing.length} steps...`, 'info');
  for (let i = 0; i < state.editing.length; i++) {
    const s = state.editing[i];
    const result = await api('/api/execute', {
      method: 'POST',
      body: JSON.stringify({ action: s.action, params: s.params }),
    });
    if (!result.success) {
      toast(`Step ${i+1} failed: ${result.error}`, 'error');
      return;
    }
  }
  toast(`All ${state.editing.length} steps executed!`, 'success');
}

function exportFlowJSON() {
  const json = JSON.stringify({ version:'1.0', steps: state.editing.map(s => ({action:s.action, params:s.params})) }, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'flow.json'; a.click();
  toast('Exported as flow.json', 'success');
}

/* ═══════════ FLOWS ═══════════ */
function renderFlows() {
  const div = document.createElement('div'); div.className = 'page-enter';

  if (state.flows.length === 0) {
    div.innerHTML = `<div class="card"><div class="empty-state"><div class="empty-icon">📂</div><p>No saved flows</p><p style="font-size:12px;">Create one in the editor first</p><button class="btn btn-primary btn-sm" onclick="switchTab('editor')">✏️ Go to Editor</button></div></div>`;
    return div;
  }

  div.innerHTML = `
    <div class="card">
      <div class="card-header">
        <h3>Saved Flows</h3>
        <span class="card-badge info">${state.flows.length} flows</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Steps</th><th>Created</th><th style="width:140px">Actions</th></tr></thead>
          <tbody>
            ${state.flows.map((f, i) => `
              <tr>
                <td>${f.name}</td>
                <td>${f.steps.length} steps</td>
                <td>${new Date(f.created).toLocaleString()}</td>
                <td>
                  <button class="btn btn-success btn-xs" onclick="replayFlow(${i})">▶️</button>
                  <button class="btn btn-outline btn-xs" onclick="editFlow(${i})">✏️</button>
                  <button class="btn btn-outline btn-xs" onclick="exportSingle(${i})">📋</button>
                  <button class="btn btn-danger btn-xs" onclick="deleteFlow(${i})">×</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
  return div;
}

async function replayFlow(i) {
  const flow = state.flows[i];
  toast(`Replaying: ${flow.name} (${flow.steps.length} steps)...`, 'info');
  for (let j = 0; j < flow.steps.length; j++) {
    const s = flow.steps[j];
    const result = await api('/api/execute', {
      method: 'POST',
      body: JSON.stringify({ action: s.action, params: s.params }),
    });
    if (!result.success) {
      toast(`Step ${j+1} failed: ${result.error}`, 'error');
      return;
    }
  }
  toast(`${flow.name} replay complete!`, 'success');
}
function editFlow(i) {
  state.editing = state.flows[i].steps.map(s => {
    const def = ACTION_DEFS[s.action] || { emoji:'❓', cls:'click' };
    return { ...s, emoji: def.emoji, cls: def.cls };
  });
  switchTab('editor');
}
function exportSingle(i) {
  const json = JSON.stringify({version:'1.0', name:state.flows[i].name, steps:state.flows[i].steps}, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = state.flows[i].name + '.json'; a.click();
}
function deleteFlow(i) {
  if (confirm(`Delete "${state.flows[i].name}"?`)) {
    state.flows.splice(i, 1);
    localStorage.setItem('ac_flows', JSON.stringify(state.flows));
    render();
    toast('Flow deleted', 'info');
  }
}

/* ═══════════ MONITOR ═══════════ */

          <button class="log-tab active">All</button>
          <button class="log-tab">Capture</button>
          <button class="log-tab">Input</button>
          <button class="log-tab">Security</button>
        </div>
        <div style="flex:1"></div>
        <button class="btn btn-outline btn-xs">▶ Start</button>
        <button class="btn btn-ghost btn-xs">⏹ Stop</button>
        <button class="btn btn-ghost btn-xs">🧹 Clear</button>
      </div>

        <div class="log-line"><span class="time">00:00:07</span><span class="level warn">WARN</span><span class="msg">Rate limit hit: click blocked at (500,300) — 45ms < 100ms</span></div>

// ── Init ──
render();
updateBadges();
</script>
