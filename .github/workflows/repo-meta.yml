name: Update Repo Metadata

on:
  workflow_dispatch:

permissions:
  contents: read
  administration: write

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Update Description & Homepage
        run: |
          curl -s -X PATCH https://api.github.com/repos/yygg693/autocomputer \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"description":"AI-driven desktop GUI automation — Rust core + Python SDK + HTML5 Dashboard","homepage":"https://github.com/yygg693/autocomputer#readme","has_wiki":false}'

      - name: Update Topics
        run: |
          curl -s -X PUT https://api.github.com/repos/yygg693/autocomputer/topics \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"names":["rust","python","automation","desktop-automation","windows","gui","screenshot","keyboard","mouse","ocr"]}'

      - name: Verify
        run: |
          echo "✅ Description:"
          curl -s https://api.github.com/repos/yygg693/autocomputer | jq .description
          echo "✅ Topics:"
          curl -s https://api.github.com/repos/yygg693/autocomputer | jq .topics
